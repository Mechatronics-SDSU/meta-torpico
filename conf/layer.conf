# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-torpico"
BBFILE_PATTERN_meta-torpico = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-torpico = "6"

LAYERDEPENDS_meta-torpico = "core"
LAYERSERIES_COMPAT_meta-torpico = "mickledore"

BOOTBIN_BITSTREAM = 'design_1.bit'

# XSA file, located in 
XSA_FILE_NAME = 'design_1.xsa' 